services:
  studio:
    image: nginx:stable-alpine
    container_name: perumda-studio
    restart: unless-stopped
    ports:
      - "3003:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: python:3.12-alpine
    container_name: perumda-studio-api
    restart: unless-stopped
    command: ["python", "/app/server.py"]
    volumes:
      - ./api:/app:ro
      - ./api-data:/data
    environment:
      - TZ=Asia/Jakarta
      - STUDIO_DATA=/data
      - STUDIO_PORT=8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
