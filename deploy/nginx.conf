server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    # API admin (backend Python) — data, media unggahan, dan halaman admin.
    # Pakai ^~ supaya location regex gambar (.jpg/.png/...) di bawah tidak menyerobot
    # /api/media/... sehingga foto unggahan ikut terlayani backend.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        proxy_pass http://api:8000/admin;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /admin/ {
        proxy_pass http://api:8000/admin/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # HTML & JS: selalu revalidasi supaya perubahan langsung terlihat
    # (Cloudflare memakai header ini; tanpa header, CF menyimpan .js 4 jam).
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Gambar jarang berubah: boleh di-cache lama
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
